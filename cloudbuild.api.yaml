# Cloud Build pipeline for API (backend)
# Use with a trigger on backend/** changes.

substitutions:
  _SERVICE: sachihouse-api
  _REGION: asia-southeast1
  _REPO: sachihouse
  _INSTANCE_CONNECTION_NAME: project-id:region:instance-name
  _JWT_SECRET_NAME: JWT_SECRET
  _DATABASE_URL_SECRET_NAME: DATABASE_URL

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$COMMIT_SHA
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --add-cloudsql-instances
      - ${_INSTANCE_CONNECTION_NAME}
      - --set-env-vars
      - STORE_MODE=postgres,NODE_ENV=production,PORT=3001
      - --set-secrets
      - DATABASE_URL=${_DATABASE_URL_SECRET_NAME}:latest,JWT_SECRET=${_JWT_SECRET_NAME}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$COMMIT_SHA
