services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sachihouse
      POSTGRES_USER: sachihouse
      POSTGRES_PASSWORD: sachihouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sachihouse -d sachihouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      PORT: 3001
      STORE_MODE: postgres
      DATABASE_URL: postgresql://sachihouse:sachihouse@db:5432/sachihouse
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
