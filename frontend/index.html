
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="SachiHouse Tokyo offers family-friendly stays with clear pricing, transport guidance, and direct online booking support."
    />
    <meta property="og:site_name" content="SachiHouse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SachiHouse | Property Listings" />
    <meta
      property="og:description"
      content="SachiHouse Tokyo offers family-friendly stays with clear pricing, transport guidance, and direct online booking support."
    />
    <meta property="og:url" content="https://sachi-house.net/" />
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/2111/2111320.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SachiHouse | Property Listings" />
    <meta
      name="twitter:description"
      content="SachiHouse Tokyo offers family-friendly stays with clear pricing, transport guidance, and direct online booking support."
    />
    <meta name="twitter:image" content="https://cdn-icons-png.flaticon.com/512/2111/2111320.png" />
    <title>SachiHouse | Property Listings</title>
    <link rel="canonical" href="https://sachi-house.net/" />
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2111/2111320.png" />
    
    <!-- PERFORMANCE OPTIMIZATION: Preconnect to key domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://sachi-house.net">

    <!-- LCP OPTIMIZATION: Preload hero listing image so browser starts fetching before JS renders -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?fm=avif&fit=crop&q=32&w=640"
      imagesrcset="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?fm=avif&fit=crop&q=32&w=320 320w, https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?fm=avif&fit=crop&q=32&w=480 480w, https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?fm=avif&fit=crop&q=32&w=640 640w"
      imagesizes="(max-width: 767px) 92vw, (max-width: 1023px) 46vw, 30vw"
      fetchpriority="high"
    />
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    <!-- Critical CSS inlined to prevent render-blocking: sets bg, font, and loading spinner appearance -->
    <style>
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
      body{margin:0;background-color:#e8e5e6;color:#1b1c1d;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh;background-color:#e8e5e6}
      /* Prevent layout shift on image containers before CSS loads */
      img{display:block;max-width:100%}
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
