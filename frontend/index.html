
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values, which the host app's bottom tab bar and every fixed mobile bar
         use to clear the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:site_name" content="SachiHouse" />
    <!-- Everything below tagged data-static-seo is a pre-hydration fallback
         only: the no-JS/crawler-before-render document, and the very first
         paint before React commits. React 19 hoists <title>/<meta> rendered
         by react-helmet-async straight into <head> (react-helmet-async's own
         `data-rh`/updateTags dedupe path is dead code once React >= 19 is
         detected — see lib/index.js's isReact19 branch — so it can no longer
         remove these for us). React 19 also does not dedupe hoisted tags
         against pre-existing ones, so components/Seo.tsx strips every
         [data-static-seo] element in a useEffect once the real tags are in
         the DOM. Do not add canonical/og:url here: those are correct for `/`
         only and wrong on every other route. -->
    <meta name="description" content="SachiHouse offers curated vacation rental properties. Browse our listings for the perfect stay." data-static-seo />
    <meta property="og:title" content="SachiHouse | Property Listings" data-static-seo />
    <meta property="og:description" content="SachiHouse offers curated vacation rental properties. Browse our listings for the perfect stay." data-static-seo />
    <meta property="og:type" content="website" data-static-seo />
    <meta property="og:image" content="https://sachi-house.net/sachi-house-icon.png" data-static-seo />
    <meta name="twitter:card" content="summary" data-static-seo />
    <meta name="twitter:title" content="SachiHouse | Property Listings" data-static-seo />
    <meta name="twitter:description" content="SachiHouse offers curated vacation rental properties. Browse our listings for the perfect stay." data-static-seo />
    <title data-static-seo>SachiHouse | Property Listings</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2111/2111320.png" />
    <!-- The home-screen icon. The rest of the install metadata (manifest,
         standalone display, app name) is injected only on /app — see
         components/host/HostAppMeta.tsx — so a guest adding a property page to
         their home screen does not get the host app. -->
    <link rel="apple-touch-icon" href="/sachi-house-icon.png" />
    
    <!-- PERFORMANCE OPTIMIZATION: Preconnect to key domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://sachi-house.net">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    <!-- Critical CSS inlined to prevent render-blocking: sets bg, font, and loading spinner appearance.
         Deliberately no border reset here. Tailwind v4 emits utilities inside @layer utilities, and an
         unlayered rule outranks a layered one whatever its specificity — so `border-width:0` on * in this
         block silently defeated every border/border-b/border-l in the app. Tailwind's own preflight already
         performs this reset, from a layer, where the utilities can override it. -->
    <style>
      *,::before,::after{box-sizing:border-box}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
      body{margin:0;background-color:#e8e5e6;color:#1b1c1d;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh;background-color:#e8e5e6}
      /* Prevent layout shift on image containers before CSS loads */
      img{display:block;max-width:100%}
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
